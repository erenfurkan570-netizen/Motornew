name: Android Otomatik Debug Build

on:
  push:
    branches: [ "main", "master" ] # Kod attığında otomatik çalışır
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub arayüzünden manuel çalıştırma sağlar

jobs:
  build:
    runs-on: ubuntu-latest # Ücretsiz Linux sanal sunucusu

    steps:
      # 1. Repodaki kodları sunucuya çeker
      - name: Kodları İndir (Checkout)
        uses: actions/checkout@v4

      # 2. Android derlemesi için güncel Java sürümünü kurar (cache parametresi kaldırıldı)
      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Android SDK ve gerekli araçları hazırlar
      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      # 4. Linux sunucusunda gradlew dosyasına çalıştırma izni verir
      - name: Gradle İzinlerini Ayarla
        run: chmod +x gradlew

      # 5. Varsa birim testlerini koşturur
      - name: Testleri Çalıştır
        run: ./gradlew testDebugUnitTest

      # 6. Debug APK dosyasını derler
      - name: Debug APK Oluştur
        run: ./gradlew assembleDebug

      # 7. Çıkan APK dosyasını GitHub üzerinden indirebilmen için paketler
      - name: Debug APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7


