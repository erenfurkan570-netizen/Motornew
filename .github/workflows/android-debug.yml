name: Android Otomatik Debug Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları İndir (Checkout)
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Gradlew Dosyasını Bul ve İzin Ver
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -maxdepth 3)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "HATA: gradlew dosyası bulunamadı!"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Bulunan dizin: $DIR"
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$DIR" >> $GITHUB_ENV

      - name: Debug APK Oluştur
        run: |
          GRADLEW_DIR="${{ env.GRADLEW_DIR }}"
          cd "$GRADLEW_DIR"
          ./gradlew assembleDebug

      - name: Debug APK Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 7
